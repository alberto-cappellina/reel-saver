<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reel Saver — scarica l'app</title>
  <style>
    :root {
      --bg: #faf7f8;
      --card: #ffffff;
      --text: #1d1b1e;
      --muted: #6b6572;
      --brand: #d62976;
      --brand2: #962fbf;
      --border: #ece6ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141216;
        --card: #1e1b20;
        --text: #f3eef5;
        --muted: #a79daf;
        --brand: #ff5fa2;
        --brand2: #c77dff;
        --border: #2c2730;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px 64px; }
    header { text-align: center; margin-bottom: 28px; }
    .logo {
      width: 96px; height: 96px; border-radius: 22px; margin: 0 auto 16px;
      display: block;
      box-shadow: 0 10px 30px rgba(214, 41, 118, .35);
    }
    h1 { font-size: 1.8rem; margin: 0 0 4px; }
    .tag { color: var(--muted); margin: 0; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
    }
    .dl {
      display: block; text-align: center; text-decoration: none;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      color: #fff; font-weight: 700; font-size: 1.1rem;
      padding: 16px 20px; border-radius: 14px;
      box-shadow: 0 8px 22px rgba(150, 47, 191, .35);
    }
    .dl:active { transform: translateY(1px); }
    .meta { text-align: center; color: var(--muted); font-size: .9rem; margin-top: 10px; }
    .note {
      font-size: .85rem; color: var(--muted); text-align: center; margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="logo" src="icon.png" alt="Reel Saver" />
      <h1>Reel Saver</h1>
      <p class="tag">Scarica e salva reel/post pubblici di Instagram</p>
    </header>

    <div class="card">
      <a class="dl" href="reel-saver.apk" download>⬇️ Scarica l'app (APK)</a>
      <p class="meta">Android 7.0+ • versione 1.2.0 • ~48 MB</p>
    </div>

    <p class="note">
      Uso personale. Funziona solo con contenuti pubblici. Rispetta il copyright
      e i termini di servizio di Instagram.
    </p>
  </div>
</body>
</html>
